spring:
  application:
    name: sports-attendance

  datasource:
    # Supabase connection pooler (port 6543) — use this for the running app
    # Format: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres
    # prepareThreshold=0 disables pgjdbc server-side prepared statements, which are
    # incompatible with PgBouncer running in transaction mode (sporadic 500s).
    url: ${DB_URL}&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      # Required for Supabase connection pooler (PgBouncer in transaction mode)
      connection-init-sql: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    # prepareThreshold=0 required for Supabase PgBouncer pooler (transaction mode)
    url: ${DB_URL}&prepareThreshold=0
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  thymeleaf:
    cache: true
    encoding: UTF-8

  security:
    user:
      name: admin   # fallback only; real users come from DB

app:
  cors:
    # Comma-separated list of allowed browser origins. Add your Vercel (or other
    # frontend) origin here via the CORS_ALLOWED_ORIGINS env var on Render.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://sportsnssce.vercel.app}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.sportscamp: INFO
