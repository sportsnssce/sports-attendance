spring:
  main:
    lazy-initialization: true

  application:
    name: sports-attendance

  datasource:
    url: ${DB_URL}&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      connection-init-sql: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    url: ${DB_URL}&prepareThreshold=0
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  thymeleaf:
    cache: true
    encoding: UTF-8

  security:
    user:
      name: admin

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://sportsnssce.vercel.app}

  keep-alive:
    enabled: ${KEEP_ALIVE_ENABLED:false}
    url: ${RENDER_EXTERNAL_URL:http://localhost:8080}/actuator/health

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.sportscamp: INFO